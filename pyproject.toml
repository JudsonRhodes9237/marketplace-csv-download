[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-export"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["marketplace_export"]

[tool.pytest.ini_options]
pythonpath = ["src"]
